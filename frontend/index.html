<!doctype html>
<html lang="en">
  <head>
    <script>
      // Apply the saved palette before paint, including when storage is unavailable.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("nobel-explorer-theme") === "dark" ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore Nobel Prize laureates, discoveries, and ideas that changed the world."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Nobel Explorer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
